# documentation: https://hermithub.pages.dev
# slogan: Self-hosted dashboard for your projects and AI coding agents (Claude Code, Codex CLI, Gemini CLI, ...).
# category: development
# tags: ai,agents,claude,codex,gemini,terminal,ide,git
# logo: svgs/hermithub.svg
# port: 8787

# Template for the Coolify service catalog (templates/compose/hermithub.yaml in coollabsio/coolify).
# One volume holds the home of the container user: database, projects, agents and their logins.

services:
  hermithub:
    image: ghcr.io/suriyadi15/hermithub:latest
    environment:
      - SERVICE_URL_HERMITHUB_8787
      # Login password, generated by Coolify. Only used on the first start; change it later in Settings.
      - HERMITHUB_PASSWORD=${SERVICE_PASSWORD_HERMITHUB}
      # Coolify's proxy sets X-Forwarded-For: use it for the failed-login lockout.
      - TRUST_PROXY=1
    volumes:
      - hermithub-home:/home/hermithub
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
