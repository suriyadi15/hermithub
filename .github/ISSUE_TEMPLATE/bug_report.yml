name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings → About, or `docker compose images`
  - type: input
    id: env
    attributes:
      label: Host
      description: OS, architecture, Docker version, browser
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `docker compose logs project-hub` (remove secrets)
      render: text
