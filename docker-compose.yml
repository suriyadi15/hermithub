# HermitHub — self-contained: everything (projects, agent logins, GitHub login, database) lives under
# ./data next to this file, which is the home folder of the container user. Nothing needs to be installed
# on the host besides Docker.
name: hermithub

services:
  hermithub:
    image: ${HERMITHUB_IMAGE:-ghcr.io/suriyadi15/hermithub}:${HERMITHUB_VERSION:-latest}
    container_name: hermithub
    hostname: hermithub
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      # Set when a reverse proxy sits in front, so login lockouts use the real client IP (docs/configuration.md).
      TRUST_PROXY: ${TRUST_PROXY:-}
      # GitHub auth goes through `gh` over HTTPS, so let SSH-style URLs (git@github.com:user/repo)
      # use it too instead of failing for lack of an SSH key.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "url.https://github.com/.insteadOf"
      GIT_CONFIG_VALUE_0: "git@github.com:"
    ports:
      # Localhost only by default. Use HERMITHUB_DOMAIN (built-in HTTPS), a reverse proxy, or a tunnel to
      # reach it from elsewhere; see docs/reverse-proxy.md.
      - "${HERMITHUB_BIND:-127.0.0.1}:${HERMITHUB_PORT:-8787}:8787"
    volumes:
      # Home of the `hermithub` user: the database (~/.hermithub), projects (~/projects), installed agents
      # (~/.local), their logins (~/.claude, ~/.codex, ~/.gemini), GitHub CLI login, git config and SSH keys.
      - ${HERMITHUB_DATA:-./data}:/home/hermithub
      # Projects default to the projects folder inside it (mounting it again changes nothing); set
      # HERMITHUB_PROJECTS to keep them in another folder on the host.
      - ${HERMITHUB_PROJECTS:-${HERMITHUB_DATA:-./data}/projects}:/home/hermithub/projects
    # Optional: cap memory for everything running inside (agent sessions included).
    # mem_limit: 6g

  # Optional HTTPS with automatic Let's Encrypt certificates. Enabled with
  # `COMPOSE_PROFILES=https` and `HERMITHUB_DOMAIN=hub.example.com` in .env (install.sh --domain does this).
  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    command: caddy reverse-proxy --from ${HERMITHUB_DOMAIN:-localhost} --to hermithub:8787
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Certificates. Kept outside ./data, which belongs to the container user.
      - ${HERMITHUB_CADDY:-./caddy}:/data
    depends_on:
      - hermithub
